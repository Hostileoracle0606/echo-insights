project_id = "bjoevzvsdlhlcjywpyfx"

[functions.speak-agent]
verify_jwt = true

[functions.retrieve-memory]
verify_jwt = true
# The memory reranker's vocabulary, read when RERANKER_MODE is set. Its model is too
# large for the bundle; it lives in the private `ml-models` bucket under its hash
# (ml/reranker/deploy/upload_model.sh) and is sha-checked when loaded.
static_files = ["./functions/_shared/reranker/vocab.txt"]

[functions.embed-entities]
verify_jwt = false

# Local-dev-only port overrides: this machine already runs another Supabase
# project's local stack on the CLI defaults (54321-54327). Shifted by +1000 to
# avoid colliding with it — has no effect on the linked remote project.
[api]
port = 55321

[db]
port = 55322
shadow_port = 55320

[studio]
port = 55323
api_url = "http://127.0.0.1:55321"

[inbucket]
port = 55324

[analytics]
port = 55327
