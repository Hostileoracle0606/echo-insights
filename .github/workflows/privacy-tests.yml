name: Privacy tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lambda-and-cdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      # jest (CDK assertions) + node tests, including log-privacy.test.mjs
      - run: npm test
        working-directory: infra

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --config scopes directory discovery to retrieve-memory, so the other
      # tests are named explicitly. log-privacy.test.ts is the LM-44 marker test.
      - run: >
          deno test --allow-net --allow-env --allow-read
          --config supabase/functions/retrieve-memory/deno.json
          supabase/functions/log-privacy.test.ts
          supabase/functions/_shared/
          supabase/functions/retrieve-memory/
          supabase/functions/embed-entities/
          supabase/functions/delete-account/

  # Must start FRESH (no cached volumes or images of a previous stack): GoTrue
  # creates the auth.* tables on boot, and the deletion guard test inspects them
  # so a new GoTrue table with a user_id column fails the guard.
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      # db and gotrue are required (gotrue creates the auth.* tables); the
      # excluded services are not needed by pgTAP.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
