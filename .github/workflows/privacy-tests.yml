name: Privacy tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lambda-and-cdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      # jest (CDK assertions) + node tests, including log-privacy.test.mjs
      - run: npm test
        working-directory: infra

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --config scopes directory discovery to retrieve-memory, so the other
      # tests are named explicitly. log-privacy.test.ts is the LM-44 marker test.
      - run: >
          deno test --allow-net --allow-env --allow-read
          --config supabase/functions/retrieve-memory/deno.json
          supabase/functions/log-privacy.test.ts
          supabase/functions/_shared/
          supabase/functions/retrieve-memory/
