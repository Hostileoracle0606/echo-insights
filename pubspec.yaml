name: lumen
description: Voice journaling that builds a live knowledge graph.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  web_socket_channel: ^3.0.1
  http: ^1.2.2

  # Audio
  # 6.x: record 5.1.2's darwin implementation predates iOS 26 — hasPermission
  # never returned (hanging startSession before capture could even begin).
  # (7.x needs Dart ≥3.12; this Flutter ships 3.11.)
  record: ^6.0.0
  just_audio: ^0.9.40
  # Shared AVAudioSession arbiter (just_audio's own session layer): we must set
  # playAndRecord ourselves — the record plugin doesn't manage the session by
  # default, and just_audio alone configures playback-only, silencing the mic.
  audio_session: ^0.1.25

  # Supabase
  supabase_flutter: ^2.5.3

  # Serialization
  json_annotation: ^4.9.0

  # Env
  flutter_dotenv: ^5.2.1

  # Utilities
  uuid: ^4.4.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
