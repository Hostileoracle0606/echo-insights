name: lumen
description: Voice journaling that builds a live knowledge graph.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  web_socket_channel: ^3.0.1
  http: ^1.2.2

  # Audio
  record: 5.1.2
  just_audio: ^0.9.40

  # Supabase
  supabase_flutter: ^2.5.3

  # Serialization
  json_annotation: ^4.9.0

  # Env
  flutter_dotenv: ^5.2.1

  # Utilities
  uuid: ^4.4.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0

dependency_overrides:
  # record 5.x allows record_linux <1.0.0, but 0.7.2 does not implement the
  # record_platform_interface 1.6 methods selected by the rest of the tree.
  record_linux: 1.3.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/.env
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
